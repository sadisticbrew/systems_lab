[package]
name = "systemslab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "gas", "instr_info"] }
libc = "0.2.190"
nix = { version = "0.31.3", features = ["ptrace", "process", "signal", "uio", "personality"] }
object = { version = "0.40.0", default-features = false, features = ["read"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "signal"] }
zstd = "0.14.2"

[dev-dependencies]
tempfile = "3.27.0"
